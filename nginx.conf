server {
    listen 7432;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── index.html & sw.js: NEVER CACHE ───────────────────────
    # These are the "entry points". The browser MUST always fetch
    # the latest version from the server so it discovers new
    # hashed asset filenames and new service worker versions.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── config.js: NEVER CACHE (runtime env injection) ────────
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Hashed assets: CACHE FOREVER ──────────────────────────
    # Vite outputs files like index-DUuLfnou.js — the hash in the
    # filename changes whenever the content changes, so these can
    # be cached aggressively. This is the key performance win.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Workbox chunks: CACHE FOREVER ─────────────────────────
    location ~* ^/workbox- {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── manifest.webmanifest: short cache ─────────────────────
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
        types {
            application/manifest+json webmanifest;
        }
    }

    # ── Icons/static: moderate cache ──────────────────────────
    location /icons/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # ── SPA fallback: all routes → index.html ─────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ──────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;
}
